services:
  # 1. Private MySQL Database Service
  - type: pserv
    name: asf-mysql
    runtime: docker
    dockerfilePath: ./mysql.Dockerfile
    disk:
      name: mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 1
    envVars:
      - key: MYSQL_ROOT_PASSWORD
        value: rootpass
      - key: MYSQL_DATABASE
        value: asf_inventory

  # 2. Node Backend API Web Service
  - type: web
    name: asf-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: DB_HOST
        value: asf-mysql
      - key: DB_PORT
        value: 3306
      - key: DB_USER
        value: root
      - key: DB_PASSWORD
        value: rootpass
      - key: DB_NAME
        value: asf_inventory
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false

  # 3. Static Frontend Web Site
  - type: web
    name: asf-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "export VITE_API_URL=${VITE_API_URL}/api && npm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

services:
  mysql:
    image: mysql:8.0
    container_name: asf_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: asf_inventory
    ports:
      - "3307:3306"          # host:container — container always listens on 3306 internally
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro   # auto-runs on first boot only
      - ./sql/users.sql:/docker-entrypoint-initdb.d/2-users.sql:ro     # runs after schema.sql (alphabetical order)
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: asf_backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    environment:
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
    volumes:
      - ./backend:/app         # live-reload: edits on your machine reflect in the container
      - /app/node_modules      # but don't let the mount shadow the installed deps
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: asf_frontend
    restart: unless-stopped
    ports:
      - "5174:5174"
    environment:
      VITE_API_URL: http://localhost:4000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  mysql_data:
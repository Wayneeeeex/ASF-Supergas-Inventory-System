services:
  mysql:
    image: mysql:8.0
    container_name: asf_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: asf_inventory
    ports:
      - "3307:3307"          # so DBeaver on your host machine can still connect
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro   # auto-runs on first boot only
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: asf_backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      DB_HOST: mysql            # container-to-container, uses the service name not "localhost"
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      DB_NAME: asf_inventory
      CORS_ORIGIN: http://localhost:5174
    volumes:
      - ./backend:/app         # live-reload: edits on your machine reflect in the container
      - /app/node_modules      # but don't let the mount shadow the installed deps
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
